name: recruiter-assistant

services:
  # ─── Data Tier ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: recruiter
    # Host ports are parameterized so the stack never collides with other apps'
    # containers on this machine — set unique values in .env (see .env.example).
    # The IN-NETWORK port (right of the colon) is unchanged, so service DSNs
    # (postgres:5432, neo4j:7687, redis:6379, api:8000) are unaffected.
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d recruiter"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/recruiterpass
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 1G
    ports: ["${NEO4J_HTTP_PORT:-7474}:7474", "${NEO4J_BOLT_PORT:-7687}:7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p recruiterpass 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── App Tier ────────────────────────────────────────────────────────────
  api:
    # Every setting in `.env` reaches this container. NOT a style choice: before
    # this line, `CAS_ENABLED` appeared ONLY in a comment below saying "Set in
    # .env" — and a variable in `.env` reaches a container solely if the compose
    # file references it. It did not, so every `docker compose up` booted
    # auth-DISABLED however `.env` was written, and the audit-log viewer was
    # reachable with no login. `env_file` fixes the whole class rather than one
    # variable, and cannot drift the way a hand-copied list of names does.
    #
    # The explicit `environment:` block below still WINS over anything here
    # (compose precedence), which is what keeps the in-network hostnames
    # (postgres, neo4j, redis) authoritative over a host-side `.env`.
    env_file: [.env]
    build:
      context: ./core
      dockerfile: Dockerfile
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["${API_PORT:-8000}:8000"]
    environment: &app_env
      POSTGRES_DSN: postgresql://app:app@postgres:5432/recruiter
      POSTGRES_POOL_MIN: "2"
      POSTGRES_POOL_MAX: "10"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: recruiterpass
      REDIS_URL: redis://redis:6379/0
      # OpenAI-compatible Ollama endpoint — set in .env (see .env.example).
      # This team runs inference on the GPU host **aria-gb10** over Tailscale
      # (LLM_BASE_URL = its tailnet IP; the box must be on the tailnet). Only if
      # you run your OWN Ollama on the app box instead:
      # http://host.docker.internal:11434/v1. NEVER a cloud endpoint. The timeout
      # must clear the model's slowest call (gpt-oss:20b ~131s at 3072 tok; use 300).
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL_GENERATION: ${LLM_MODEL_GENERATION:-gpt-oss:20b}
      LLM_MODEL_EMBEDDING: ${LLM_MODEL_EMBEDDING:-nomic-embed-text}
      LLM_EMBEDDING_DIM: "768"
      # 900, from MEASUREMENT, not judgement. `scripts/model-check.sh` probed
      # every real prompt against gpt-oss:20b on an idle peer at the worker's own
      # concurrency (4) and recorded a slowest call of 419s, giving a derived
      # recommendation of 838s — see docs/model-profiles/gpt-oss-20b.json.
      #
      # The old default was 120s. With `llm_max_retries = 2` that is three
      # attempts per call, so a parse died after ~360s, the circuit breaker
      # opened, and parsing stopped entirely (2026-08-21). This value and
      # REASONING_JSON_MIN_TOKENS are COUPLED: raising the token budget without
      # raising this converts empty responses into timeouts. `doctor.sh` now
      # fails when this drops below the profile's recommendation, so the two
      # cannot drift apart again.
      LLM_TIMEOUT_S: "${LLM_TIMEOUT_S:-900}"
      STORAGE_DIR: /data
      PII_KEY: ${PII_KEY:?PII_KEY must be set — 32 random bytes, base64}
      # ADR-008: required — an empty salt would key every non-vocab Skill
      # node with an unsalted (dictionary-attackable) hash.
      SKILL_HASH_SALT: ${SKILL_HASH_SALT:?SKILL_HASH_SALT must be set — 32 random bytes, base64}
      BLIND_REVIEW_DEFAULT: "true"
      COVERAGE_THRESHOLD: "80"
      # ── API auth (FU-4: keyed roles) — security finding fix/auth-boundary-
      # fails-open (F1b). Auth is DISABLED (fail-open, local-dev only) iff ALL
      # FOUR are empty/unset — see src.settings.Settings.auth_enabled and
      # validate_startup_auth_config, which now REFUSES to boot when
      # CAS_ENABLED=true with all four empty. Set in .env (see .env.example).
      API_KEY_ADMIN: ${API_KEY_ADMIN:-}
      API_KEY_RECRUITER: ${API_KEY_RECRUITER:-}
      API_KEY_HIRING_MANAGER: ${API_KEY_HIRING_MANAGER:-}
      API_KEY_AUDITOR: ${API_KEY_AUDITOR:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux: reach Ollama on metal
    volumes:
      - "./core:/app"
      - "./data:/data"                        # filesystem BlobStore
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: arq src.worker.main.WorkerSettings
    environment: *app_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./core:/app"
      - "./data:/data"
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    # Same reason as the api service above — the browser-side CAS gate in
    # frontend/app.py reads settings.cas_enabled, so without this it is an
    # unconditional passthrough no matter what `.env` says.
    env_file: [.env]
    build:
      context: ./core
      dockerfile: Dockerfile
    command: flask --app frontend.app run --host 0.0.0.0 --port 5000 --debug
    ports: ["${FRONTEND_PORT:-5000}:5000"]
    environment:
      API_BASE_URL: http://api:8000
      FLASK_SECRET_KEY: dev-only-change-me
      # The Flask BFF presents ONE fixed role key (recruiter) for every
      # browser it serves (frontend/api_client.py::build_client) — without
      # this, enabling auth (any API_KEY_* configured above) 401s every
      # backend call the frontend makes on a browser's behalf.
      API_KEY_RECRUITER: ${API_KEY_RECRUITER:-}
    volumes: ["./core:/app"]
    depends_on: [api]

volumes:
  pgdata:
  neo4jdata:
