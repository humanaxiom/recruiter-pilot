repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^core/
      - id: ruff-format
        files: ^core/

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        files: ^core/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--strict]
        files: ^core/src/

  - repo: local
    hooks:
      - id: fast-unit-tests
        name: fast unit tests
        entry: bash -c 'cd core && pytest tests/unit -q --timeout=60 -x'
        language: system
        pass_filenames: false
        files: ^core/(src|tests)/

      - id: branch-name
        name: branch name gate
        entry: bash -c 'B=$(git branch --show-current); [[ "$B" =~ ^(agent|feat|fix|chore)/[a-zA-Z0-9._-]+$ ]] || { echo "Branch $B violates naming gate"; exit 1; }'
        language: system
        pass_filenames: false
        always_run: true
