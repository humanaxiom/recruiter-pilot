# Skill families DERIVED from the harmonized SFU JD corpus (jd-bank `canonical_jds`,
# 1,802 JDs / 9,176 qualification statements / 1,222 distinct titles / 449 departments).
#
# Every member below was selected because it appears in that corpus at or above the
# frequency floor — this is not a guessed ontology. Counts in comments are corpus
# occurrences of that term or its close variants.
#
# The existing 19 software families in categories.yaml are KEPT unchanged (they serve
# SFU's actual IT postings); these are ADDITIVE.

