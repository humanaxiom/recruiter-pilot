# Hand-curated skill aliases. Each canonical name maps to a list of
# variants the LLM is likely to produce. _basic_normalise looks here
# BEFORE the vector-search fallback.
#
# Conventions:
#   - canonical name is lower-case; we recase for display elsewhere
#   - keep aliases lower-cased and trimmed
#   - include the canonical name itself in `aliases` for round-trip safety
#
# Add freely. The Phase-6 matching quality compounds from this list.

- canonical: javascript
  aliases: [javascript, js, ecmascript, java script]
- canonical: typescript
  aliases: [typescript, ts]
- canonical: python
  aliases: [python, python3, py]
- canonical: java
  aliases: [java]
- canonical: react
  aliases: [react, reactjs, react.js, react js]
- canonical: vue
  aliases: [vue, vue.js, vuejs]
- canonical: angular
  aliases: [angular, angular.js, angularjs]
- canonical: node.js
  aliases: [node.js, node, nodejs]
- canonical: postgresql
  # "psql" added (Phase 4b spelling-recall fix): the Postgres CLI tool name,
  # commonly used on a résumé/JD as shorthand for the database itself —
  # neither a version variant nor a parenthetical, so normalisation alone
  # can't recover it; a single, high-value alias.
  aliases: [postgresql, postgres, pgsql, psql]
- canonical: mysql
  aliases: [mysql, my sql]
- canonical: kubernetes
  aliases: [kubernetes, k8s, kube]
- canonical: docker
  # "docker compose" added (Phase 4b spelling-recall fix): the multi-
  # container orchestration tool shipped BY Docker, commonly listed as a
  # single résumé/JD line for what is, for skill-matching purposes, the same
  # underlying containerization skill. "containerization" added (post-4b
  # security fix — paren-split skill inflation gate): the bare word is
  # itself a legitimate, common résumé/JD spelling for the same skill (see
  # "Containerization (Docker)" in SPELLING_RECALL_FIXTURES) — registering
  # it as a vocab alias lets it resolve at the ordinary outer-full-resolve
  # step instead of needing the (now-gated) parenthetical-content fallback.
  aliases: [docker, "docker compose", containerization]
- canonical: terraform
  aliases: [terraform, tf]
- canonical: aws
  aliases: [aws, amazon web services]
- canonical: gcp
  aliases: [gcp, google cloud, google cloud platform]
- canonical: azure
  aliases: [azure, microsoft azure]
- canonical: redis
  aliases: [redis]
- canonical: neo4j
  aliases: [neo4j, cypher]
- canonical: fastapi
  aliases: [fastapi, fast api]
- canonical: django
  aliases: [django]
- canonical: flask
  aliases: [flask]
- canonical: spring boot
  aliases: [spring boot, springboot, spring]
- canonical: kafka
  # "kafka streams" added (Phase 4b spelling-recall fix): Kafka's own
  # stream-processing library — same ecosystem/skill for matching purposes,
  # not a version or parenthetical variant normalisation could recover.
  aliases: [kafka, apache kafka, "kafka streams"]
- canonical: elasticsearch
  aliases: [elasticsearch, elastic search, elastic]

