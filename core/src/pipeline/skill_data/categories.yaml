# Skill families (categories) for SEMANTIC skill matching (ADR 0020).
#
# Maps a skill FAMILY → the canonical skills that belong to it. The matcher
# gives a required skill GRADUATED credit: an exact skill match scores full,
# a candidate skill in the SAME family scores partial, an unrelated skill 0.
# This is why a candidate with "react" credits a "frontend development"
# requirement (both `frontend`), while "python" credits nothing toward "voip"
# (different families) — embedding cosine can't separate those reliably
# (calibration: voip↔python 0.72 > react↔frontend 0.70), a curated family map
# can.
#
# A skill may belong to MORE THAN ONE family (list it under each); the matcher
# credits a shared family. Keep names lower-cased and matching the canonical
# names in aliases.yaml. Skills not listed here get no CURATED family. Since
# ADR-044 a parse-time classifier may assign them a family from the keys below,
# recorded separately on `Skill.classified_categories` so a curated family and
# a model-inferred one stay distinguishable forever. Note it is NOT a backfill:
# the ADR-008 skill hash is one-way, so classification has to happen while the
# cleartext name is still in hand and can never be run over the graph later.
# (An earlier version of this comment described a backfill task; that design is
# impossible for exactly that reason.)
#
# The TOP-LEVEL KEYS of this file are the family VOCABULARY. Three things read
# them in THIS repo: `skills_graph._category_table()`, the
# `match_non_matchable_families` setting, and — since ADR-044 —
# `skills_graph._category_family_names()`, which feeds
# `skill_classifier.known_families()`. `worker.skill_normalize
# .skill_categories_vocab()`, named in the hris original, was never ported and
# does not exist here.
#
# Grow the taxonomy by adding a family key here (no code change) — but note it
# is no longer inert: a new key also widens the parse-time classifier's closed
# assignable set and the family list named in its prompt (ADR-044). Adding a
# family makes it a legal answer the model may assign to any out-of-vocabulary
# skill name. `other` and `domain` are deliberate
# catch-alls kept in the vocab but EXCLUDED from family credit by
# `match_non_matchable_families` (they're junk/ambiguous buckets, not a
# relatedness signal). Add freely; matching quality compounds from this map.

# `canvas` is intentionally multi-family: HTML5 Canvas (frontend) AND Canvas LMS
# (edtech). One canonical node carries both families so it credits either
# requirement (ADR 0021 accepts the resulting rare false-positive over a miss).
